<!DOCTYPE html>
<!--
  다이어리 - 바이브 코딩 실습
  이 파일은 화면의 "구조"만 담당합니다.
  두 사람이 함께 쓰는 공용 파일입니다. 고치기 전에 상대에게 말하세요.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>류이어리</title>

    <!-- 탭 파비콘 (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="icons/icon-192.png" />

    <!-- PWA & iOS 홈 화면 앱 지원 -->
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="류이어리" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#e66d7b" />

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 앱 내 실시간 토스트 알림 컨테이너 -->
    <div id="toast-container" class="toast-container"></div>

    <header class="header">
      <h1 class="header-title">류이어리</h1>
      <button id="notif-bell-btn" class="notif-bell-btn" type="button" title="새 글/댓글 알림 켜기">🔔</button>
    </header>

    <main class="main">
      <!-- 문제가 생기면 여기에 표시됨 -->
      <p id="error-banner" class="error-banner" hidden></p>

      <!-- 로그인 전에 보이는 곳 (외부인에게는 실명 및 공지 일체 비노출) -->
      <section id="login-area" class="login-area">
        <p class="login-message">허용된 사람만 볼 수 있는 일기장입니다.</p>
        <button id="login-button" class="login-button" type="button">
          구글 계정으로 로그인
        </button>
      </section>

      <!-- 암호 확인 팝업 모달 -->
      <div id="passcode-modal" class="modal-overlay" hidden>
        <div class="modal-content passcode-modal-card">
          <div class="modal-icon">🔒</div>
          <h2 class="modal-title">암호를 대시오</h2>
          <p class="modal-desc">다이어리에 접근하려면 암호를 입력해야 합니다.</p>
          <form id="passcode-form" class="passcode-form">
            <input
              type="text"
              id="passcode-input"
              class="passcode-input"
              placeholder="암호를 입력하세요"
              autocomplete="off"
              required
            />
            <p id="passcode-error" class="passcode-error" hidden></p>
            <div class="modal-actions">
              <button type="button" id="passcode-cancel-btn" class="modal-btn cancel">취소</button>
              <button type="submit" id="passcode-submit-btn" class="modal-btn submit">확인</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 로그인 후에 보이는 곳 (인증 후 다이어리 진입 시에만 노출) -->
      <div id="app-area" hidden>
        <!-- 상단 공지사항 영역 -->
        <section id="notice-area" class="notice-area">
          <div class="notice-header">
            <div class="notice-title-wrap">
              <span class="notice-icon">📢</span>
              <span class="notice-title">공지사항</span>
              <span id="notice-count" class="notice-count"></span>
            </div>
            <div class="notice-controls">
              <button id="add-notice-btn" class="notice-btn" type="button">+ 공지 쓰기</button>
              <button id="toggle-notices-btn" class="notice-toggle-btn" type="button" title="접기">▲</button>
            </div>
          </div>

          <!-- 공지 작성/수정 폼 -->
          <div id="notice-form-wrapper" class="notice-form-wrapper" hidden>
            <textarea id="notice-input" class="notice-input" rows="3" placeholder="공지사항 내용을 입력하세요..."></textarea>
            <div class="notice-form-actions">
              <button id="notice-cancel-btn" class="notice-action-btn cancel" type="button">취소</button>
              <button id="notice-submit-btn" class="notice-action-btn submit" type="button">등록</button>
            </div>
          </div>

          <!-- 공지 목록 -->
          <ul id="notice-list" class="notice-list"></ul>
        </section>

        <p class="who">
          <span class="who-info">
            쓰는 사람: <strong id="who-am-i"></strong>
            <button id="change-name-button" class="change-name-button" type="button">
              내 이름 변경
            </button>
            <button id="manage-users-button" class="manage-users-button" type="button">
              👥 친구 이름 변경
            </button>
          </span>
          <button id="logout-button" class="logout-button" type="button">
            로그아웃
          </button>
        </p>

        <!-- 글 쓰는 곳 -->
        <section class="editor">
          <!-- 오늘의 기분 선택 바 -->
          <div class="mood-selector-container">
            <span class="mood-title">오늘의 기분:</span>
            <div id="mood-options" class="mood-options">
              <button type="button" class="mood-btn" data-mood="😁" title="기쁨/신남">😁</button>
              <button type="button" class="mood-btn" data-mood="🥰" title="행복/사랑">🥰</button>
              <button type="button" class="mood-btn" data-mood="😭" title="슬픔/눈물">😭</button>
              <button type="button" class="mood-btn" data-mood="🤬" title="화남/분노">🤬</button>
              <button type="button" class="mood-btn" data-mood="🫪" title="멘붕/멍함">🫪</button>
              <button type="button" class="mood-btn" data-mood="😴" title="피곤/졸림">😴</button>
            </div>
          </div>

          <input
            id="title-input"
            class="title-input"
            type="text"
            placeholder="제목 (미입력 시 'M/D 오늘의 일기' 자동 입력)"
          />
          <textarea
            id="body-input"
            class="body-input"
            rows="5"
            placeholder="오늘 있었던 일"
          ></textarea>

          <!-- 그림 그리기 토글 버튼 -->
          <button id="draw-toggle-btn" class="draw-toggle-btn" type="button">
            🎨 그림 그리기
          </button>

          <!-- 접이식 그림판 영역 -->
          <div id="drawing-container" class="drawing-container" hidden>
            <div class="drawing-toolbar">
              <div class="tool-group">
                <button type="button" id="tool-pen" class="tool-btn active">✏️ 펜</button>
                <button type="button" id="tool-eraser" class="tool-btn">🧹 지우개</button>
              </div>
              <div class="tool-group colors-group">
                <input type="color" id="tool-color-picker" class="color-picker" value="#333333" title="색상 선택" />
                <button type="button" class="color-chip active" data-color="#333333" style="background-color: #333333;"></button>
                <button type="button" class="color-chip" data-color="#e66d7b" style="background-color: #e66d7b;"></button>
                <button type="button" class="color-chip" data-color="#3b82f6" style="background-color: #3b82f6;"></button>
                <button type="button" class="color-chip" data-color="#10b981" style="background-color: #10b981;"></button>
                <button type="button" class="color-chip" data-color="#f59e0b" style="background-color: #f59e0b;"></button>
              </div>
              <div class="tool-group size-group">
                <button type="button" class="size-btn" data-size="3" title="얇게">●</button>
                <button type="button" class="size-btn active" data-size="8" title="보통">●</button>
                <button type="button" class="size-btn" data-size="16" title="굵게">●</button>
              </div>
              <div class="tool-group action-group">
                <button type="button" id="tool-undo" class="tool-btn action-btn" title="실행취소">↩ 취소</button>
                <button type="button" id="tool-clear" class="tool-btn action-btn" title="전체 지우기">🗑️ 지우기</button>
              </div>
            </div>
            <div class="canvas-wrapper">
              <canvas id="drawing-canvas"></canvas>
            </div>
          </div>

          <button id="save-button" class="save-button" type="button">
            저장
          </button>
        </section>

        <!-- 쓴 글이 쌓이는 곳 (좌우 2분할) -->
        <section class="entries">
          <p id="empty-message" class="empty-message" hidden>아직 쓴 글이 없습니다.</p>
          <div class="entries-split-container">
            <!-- 왼쪽: 상대의 일기 -->
            <div class="entries-column others-column">
              <div class="column-header">
                <div class="column-title-wrap">
                  <span class="column-icon">📝</span>
                  <span class="column-title">상대의 일기</span>
                </div>
                <span id="others-count" class="column-count">0</span>
              </div>
              <p id="others-empty" class="column-empty" hidden>아직 상대가 쓴 일기가 없습니다.</p>
              <ul id="others-entry-list" class="entry-list"></ul>
            </div>

            <!-- 오른쪽: 내가 쓴 일기 -->
            <div class="entries-column my-column">
              <div class="column-header">
                <div class="column-title-wrap">
                  <span class="column-icon">📝</span>
                  <span class="column-title">내가 쓴 일기</span>
                </div>
                <span id="my-count" class="column-count">0</span>
              </div>
              <p id="my-empty" class="column-empty" hidden>아직 내가 쓴 일기가 없습니다.</p>
              <ul id="my-entry-list" class="entry-list"></ul>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- type="module" 을 지우면 앱이 통째로 죽습니다 -->
    <script type="module" src="app.js"></script>
  </body>
</html>
